efault":"regularised","kind":"{original|regularised}","choices":["original","regularised"],"cages":[]},{"name":"dw_thrust_cap","group":"physics","help":"regularised only: cap the downwash peak at the upper module's thrust","default":"true","kind":"[BOOL]","choices":[],"cages":[]},{"name":"dw_dz_ramp","group":"physics","help":"m, regularised only: downwash fades in linearly over this height below the upper rotor plane (0 = no ramp)","default":"0.05","kind":"FLOAT","choices":[],"cages":[]},{"name":"dw_min_width","group":"physics","help":"m, regularised only: floor on the plume width beta. null = the module's arm length L; 0 = no floor","default":"null","kind":"FLOAT","choices":[],"cages":[]},{"name":"module_collisions","group":"physics","help":"contact between modules: off (none), all (every pair; docked cages touch, so contact fights the welds) or undocked (every pair except those whose cages touch in the docked structure)","default":"undocked","kind":"{off|all|undocked}","choices":["off","all","undocked"],"cages":[]},{"name":"cage","group":"module","help":"cage around each CF2X: box (docked face to face, or half a face between offset rows), tetra (regular tetrahedron, docked vertex to vertex), triangle (triangular prism, see triangle_connect), hex (hexagonal prism, docked face to face), dodeca (regular dodecahedron, docked as in the Dodecacopter: two shared vertices, coplanar faces), tiling (a mix of polygon prisms, see `tiling`) or none (bare CF2X, task: hover only)","default":"box","kind":"{box|tetra|triangle|hex|dodeca|tiling|none}","choices":["box","tetra","triangle","hex","dodeca","tiling","none"],"cages":[]},{"name":"tiling","group":"module","help":"tiling cages: an edge-to-edge tiling of regular polygons, named by the polygons round each vertex. 3.4.6.4 triangles + squares + hexagons, 3.6.3.6 triangles + hexagons, 3.3.3.4.4 and 3.3.4.3.4 triangles + squares, 4.8.8 squares + octagons, 4.6.12 squares + hexagons + 12-gons, 3.12.12 triangles + 12-gons; 4.4.4.4, 3 ocked neighbours)","default":"square","kind":"{rows|square|triangle|rhombus|hexagon|pyramid|rings}","choices":["rows","square","triangle","rhombus","hexagon","pyramid","rings"],"cages":[]},{"name":"size","group":"layout","help":"layout size: side length in modules, or layers of a pyramid","default":"3","kind":"INT","choices":[],"cages":[]},{"name":"rows","group":"layout","help":"layout rows: modules per row, top (+y) row first, every row centred. Box: rows of equal parity line up (full faces), others sit half a cage off (half faces). Triangular lattices (hex, dodeca, triangle): rows always sit half a slot off; a row with the parity of the one above shifts half a slot to +x. Face-docked triangles: counts are triangles per row","default":"2,3,2","kind":"INT[,...]","choices":[],"cages":[]},{"name":"fill","group":"layout","help":"which modules of the shape to keep: solid (all), hollow (those on the convex hull's boundary: a flat shape's outline, a 3-D shape's surface) or frame (those on the hull's edges: the outline, or a 3-D shape's edge skeleton). hexagon 2 + frame = ring of 6","default":"solid","kind":"{solid|hollow|frame}","choices":["solid","hollow","frame"],"cages":[]},{"name":"fractal","group":"layout","help":"levels of self-similar repetition of the (filled) shape: each level puts a copy at every module, scaled up just enough not to overlap. triangle 2 -> Sierpinski triangle (3^L), pyramid 2 -> Sierpinski tetrahedron (4^L), square 3 + frame -> Sierpinski carpet (8^L)","default":"1","kind":"INT","choices":[],"cages":[]},{"name":"start_spacing","group":"approach","help":"m, ground distance between neighbouring module centres at the start","default":"0.5","kind":"FLOAT","choices":[],"cages":[]},{"name":"z0","group":"approach","help":"m, start height of the module CoMs. null = resting on the cage bottom (box, triangle, hex 0.03; tetra 0.07; dodeca 0.09)","default":"null","kind":"FLOAT","choices":[],"cages":[]},{"name":"stage_spacing","group":"approach","help":"m, distance between neighbouring module centres at the staging points, where the modules hold before they close in to dock (the layout scaled up). Never less than stage_gap between the cages' bounding spheres, so the default is the tightest spread stage_gap allows","default":"0.01","kind":"FLOAT","choices":[],"cages":[]},{"name":"stage_gap","group":"approach","help":"m, least clearance between neighbouring cages' bounding spheres at the staging points; raise it for a wider spread, lower it (even 0) for a tighter one","default":"0.05","kind":"FLOAT","choices":[],"cages":[]},{"name":"meet_z","group":"approach","help":"m, docking height of the assembly CoM","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"stage_clearance","group":"approach","help":"m, lowest cage height at the staging points","default":"0.3","kind":"FLOAT","choices":[],"cages":[]},{"name":"rise_t","group":"approach","help":"s, climb from the ground to the staging points","default":"3.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"close_t","group":"approach","help":"s, contract from the staging points to the slots","default":"4.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"snap_gap","group":"approach","help":"m, every docked pair within this of its slot offset triggers the welds","default":"0.03","kind":"FLOAT","choices":[],"cages":[]},{"name":"snap_timeout","group":"approach","help":"s after rise_t + close_t without a snap: the run stops and fails","default":"5.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"hover_t","group":"approach","help":"s, hover at meet_z after the snap","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"failure","group":"failure","help":"add the failure segment: climb to fail_z, hold, failure, recover, final hover","default":"false","kind":"[BOOL]","choices":[],"cages":[]},{"name":"fail_mask","group":"failure","help":"failing modules, one 0/1 per module in map order (1,0,0 or [1, 0, 0] or 100), or edge = the -x edge of the bottom layer","default":"edge","kind":"STR","choices":[],"cages":[]},{"name":"fail_z","group":"failure","help":"m, climb or descend here before the failure","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"hold_t","group":"failure","help":"s, hover at fail_z before the failure","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"outage","group":"failure","help":"fraction of commanded thrust a failing module keeps (0 = motors off)","default":"0.5","kind":"FLOAT","choices":[],"cages":[]},{"name":"outage_t","group":"failure","help":"s, failure duration","default":"0.5","kind":"FLOAT","choices":[],"cages":[]},{"name":"final_t","group":"failure","help":"s, hover after recovery, before landing","default":"3.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"recover_pos_tol","group":"failure","help":"m, 'stable' after a failure: position error below this","default":"0.05","kind":"FLOAT","choices":[],"cages":[]},{"name":"recover_vel_tol","group":"failure","help":"m/s, 'stable': speed below this","default":"0.05","kind":"FLOAT","choices":[],"cages":[]},{"name":"recover_tilt_deg","group":"failure","help":"deg, 'stable': tilt below this","default":"3.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"recover_rate_tol","group":"failure","help":"rad/s, 'stable': body rate below this","default":"0.1","kind":"FLOAT","choices":[],"cages":[]},{"name":"circle","group":"circle","help":"add the circle segment after the hover (and after the failure segment)","default":"false","kind":"[BOOL]","choices":[],"cages":[]},{"name":"radius","group":"circle","help":"m, circle radius","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"laps","group":"circle","help":"laps around the circle","default":"2.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"lap_t","group":"circle","help":"s, average time per lap (speed follows 1 - cos, peak = 2 x average)","default":"10.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"climb_rate","group":"land","help":"m/s, climb or descent to fail_z","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"land_speed","group":"land","help":"m/s, descent speed above land_slow_below","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"land_speed_low","group":"land","help":"m/s, descent speed below land_slow_below","default":"0.3","kind":"FLOAT","choices":[],"cages":[]},{"name":"land_slow_below","group":"land","help":"m, height where the descent slows down","default":"1.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"pos_wn","group":"controller","help":"rad/s, assembly position loop natural frequency","default":"2.5","kind":"FLOAT","choices":[],"cages":[]},{"name":"module_wn","group":"controller","help":"rad/s, per-module position loop during the approach (stiffer: pushes into the downwash of modules above)","default":"4.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"pos_zeta","group":"controller","help":"position loop damping ratio","default":"0.9","kind":"FLOAT","choices":[],"cages":[]},{"name":"ki_ratio","group":"controller","help":"integral gain KI = ki_ratio wn^3 (s^-3), removes the steady downwash sag. 0 = PD only","default":"0.256","kind":"FLOAT","choices":[],"cages":[]},{"name":"carry_integral","group":"controller","help":"at the snap, start the assembly integral at the mean module integral (keeps the downwash already learnt)","default":"true","kind":"[BOOL]","choices":[],"cages":[]},{"name":"att_wn_rp","group":"controller","help":"rad/s, attitude loop natural frequency, roll and pitch","default":"20.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"att_wn_yaw","group":"controller","help":"rad/s, attitude loop natural frequency, yaw","default":"8.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"att_zeta","group":"controller","help":"attitude loop damping ratio","default":"0.8","kind":"FLOAT","choices":[],"cages":[]},{"name":"allocation","group":"controller","help":"how the assembly controller shares thrust when rotors differ (mixed drone sizes, tilted rotors): capacity (each rotor in proportion to its maximum thrust, so all saturate together) or equal (least-norm thrusts). Identical upright modules keep the prioritised allocation","default":"capacity","kind":"{capacity|equal}","choices":["capacity","equal"],"cages":[]},{"name":"max_tilt_deg","group":"controller","help":"deg, cap on the commanded tilt","default":"35.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_hover_cm","group":"checks","help":"cm, hover position error after the snap","default":"5.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_slot_cm","group":"checks","help":"cm, worst slot error (assembly stays rigid)","default":"0.5","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_upset_deg","group":"checks","help":"deg, the failure must tilt the assembly more than this ...","default":"2.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_upset_drop","group":"checks","help":"m, ... or drop it more than this","default":"0.05","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_recover_margin","group":"checks","help":"m, lowest CoM during recovery stays this far above the ground rest height","default":"0.1","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_final_cm","group":"checks","help":"cm, final hover error after recovery","default":"5.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_circle_cm","group":"checks","help":"cm, worst circle tracking error","default":"10.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_land_cm","group":"checks","help":"cm, landed CoM height above the ground rest height","default":"2.5","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_land_tilt_deg","group":"checks","help":"deg, landed tilt","default":"5.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"check_land_speed","group":"checks","help":"m/s, landed speed","default":"0.05","kind":"FLOAT","choices":[],"cages":[]},{"name":"hover_target","group":"hover","help":"m, hover task: target position","default":"0.0,0.0,1.0","kind":"FLOAT[,...]","choices":[],"cages":[]},{"name":"hover_duration","group":"hover","help":"s, hover task: flight time","default":"10.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"hover_ctrl_freq","group":"hover","help":"Hz, hover task: stock PID rate (physics runs at freq)","default":"48","kind":"INT","choices":[],"cages":[]},{"name":"hover_tol","group":"hover","help":"m, hover task: final position error check","default":"0.05","kind":"FLOAT","choices":[],"cages":[]},{"name":"plume","group":"plume","help":"draw live isolines of equal aero force: off, dw (downwash), gnd (ground effect), drag or all. Bare --plume means dw","default":"off","kind":"{off|dw|gnd|drag|all}","choices":["off","dw","gnd","drag","all"],"cages":[]},{"name":"plume_rate","group":"plume","help":"Hz of sim time, isoline redraw rate","default":"20.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"plume_levels","group":"plume","help":"isoline levels, multiples of one module's weight W, weakest first","default":"0.02,0.1,0.5","kind":"FLOAT[,...]","choices":[],"cages":[]},{"name":"plot","group":"logging","help":"plot the flight log at the end (shared Logger, opens a window)","default":"false","kind":"[BOOL]","choices":[],"cages":[]},{"name":"live_plot","group":"logging","help":"open a window that plots the run as it flies: height, horizontal error and tilt of each assembly, against their targets","default":"false","kind":"[BOOL]","choices":[],"cages":[]},{"name":"live_plot_rate","group":"logging","help":"Hz of sim time, live plot refresh rate","default":"5.0","kind":"FLOAT","choices":[],"cages":[]},{"name":"save_log","group":"logging","help":"save the flight log as .npy into output_folder","default":"false","kind":"[BOOL]","choices":[],"cages":[]},{"name":"log_rate","group":"logging","help":"Hz, flight log sample rate (used by plot and save_log)","default":"48","kind":"INT","choices":[],"cages":[]}]};
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let cage = "all";

function hl(text, words) {
  let s = esc(text);
  for (const w of words) {
    if (!w) continue;
    s = s.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
  }
  return s;
}

function render() {
  const words = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const keep = f => (cage === "all" || !f.cages.length || f.cages.includes(cage)) &&
    words.every(w => [f.name, f.group, f.help, f.default, ...f.choices, ...f.cages].join(" ").toLowerCase().includes(w));
  let html = "", total = 0, nav = "";
  for (const [g, title] of Object.entries(D.groups)) {
    const fs = D.fields.filter(f => f.group === g && keep(f));
    total += fs.length;
    nav += `<li><a href="#g-${g}" class="${fs.length ? "" : "empty"}">${g}<span>${fs.length}</span></a></li>`;
    if (!fs.length) continue;
    html += `<section><h2 id="g-${g}">${g}</h2><p>${esc(title)}</p><dl>` + fs.map(f => {
      const choices = f.choices.length ? `<span>choices ${f.choices.map(c => `<code>${hl(c, words)}</code>`).join(" ")}</span>` : "";
      const only = f.cages.length ? `<span>${f.cages.join(", ")} only</span>` : "";
      return `<div class="row"><dt><button data-f="${f.name}" title="Copy --${f.name} ${esc(f.default)}">--${hl(f.name, words)}</button>` +
        `<span class="kind">${esc(f.kind)}</span></dt><dd>${hl(f.help, words)}<div class="meta">` +
        `<span>default <code>${hl(f.default, words)}</code></span>${choices}${only}</div></dd></div>`;
    }).join("") + "</dl></section>";
  }
  $("list").innerHTML = html || `<p class="none">No field matches “${esc(words.join(" "))}”. Clear the search or pick another cage.</p>`;
  $("groups").innerHTML = nav;
  $("count").textContent = `${total} of ${D.fields.length} fields`;
  $("layouts").textContent = cage === "all" ? "" : "layouts: " + D.layouts[cage].join(", ");
}

$("cages").innerHTML = ["all", ...D.cages].map(c => `<button aria-pressed="${c === "all"}" data-c="${c}">${c}</button>`).join("");
$("cages").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  cage = b.dataset.c;
  for (const x of $("cages").children) x.setAttribute("aria-pressed", x === b);
  render();
});
$("q").addEventListener("input", render);
$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-f]"); if (!b) return;
  const f = D.fields.find(x => x.name === b.dataset.f);
  const text = `--${f.name} ${f.default}`;
  try { await navigator.clipboard.writeText(text); } catch (_) { return; }
  const note = document.createElement("span");
  note.className = "copied"; note.textContent = ` copied ${text} (YAML: ${f.name}: ${f.default})`;
  b.parentNode.querySelector(".copied")?.remove();
  b.after(note); setTimeout(() => note.remove(), 2500);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") { $("q").value = ""; render(); $("q").blur(); }
});
render();
</script>
