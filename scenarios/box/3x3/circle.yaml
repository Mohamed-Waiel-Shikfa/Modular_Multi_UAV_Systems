# box/3x3/circle: Nine box-caged modules in a 3 x 3 square, docked face to face.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/box/3x3/circle.yaml
#   python simulate.py --scenario scenarios/box/3x3/circle.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/box/3x3/circle.yaml --size 4
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: box
layout: square
size: 3
circle: true
radius: 1.0
laps: 2
