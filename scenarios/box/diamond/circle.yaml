# box/diamond/circle: Nine box-caged modules in a rhombus, rows 1 2 3 2 1, each row offset half a cage
#   (brick bond): full faces in a row, half faces across rows.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/box/diamond/circle.yaml
#   python simulate.py --scenario scenarios/box/diamond/circle.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/box/diamond/circle.yaml --size 4
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: box
layout: rhombus
size: 3
circle: true
radius: 1.0
laps: 2
