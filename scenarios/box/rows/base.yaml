# box/rows/base: Ten box-caged modules in rows 3 2 2 3: rows of different parity sit half a cage off
#   (half faces, brick bond), rows of the same parity line up (full faces).
# Mission: dock in the air, hover, land.
#
#   python simulate.py --scenario scenarios/box/rows/base.yaml
#   python simulate.py --scenario scenarios/box/rows/base.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/box/rows/base.yaml --rows 3,2,3,2
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: box
layout: rows
rows: [3, 2, 2, 3]
