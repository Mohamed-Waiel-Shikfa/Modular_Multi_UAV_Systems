# box/rows/fail: Ten box-caged modules in rows 3 2 2 3: rows of different parity sit half a cage off
#   (half faces, brick bond), rows of the same parity line up (full faces).
# Mission: dock, hover, climb to fail_z; chosen modules drop to `outage` x their thrust for outage_t,
#   the assembly recovers, hovers final_t and lands.
#
#   python simulate.py --scenario scenarios/box/rows/fail.yaml
#   python simulate.py --scenario scenarios/box/rows/fail.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/box/rows/fail.yaml --rows 3,2,3,2
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: box
layout: rows
rows: [3, 2, 2, 3]
failure: true
fail_mask: edge   # the two -x modules (the ends of the rows of 3)
