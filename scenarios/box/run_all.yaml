# box/run_all: every base scenario of the box cage, flying at the same time in one simulation, side by side.
#
#   python simulate.py --scenario scenarios/box/run_all.yaml --gui
#   python simulate.py --scenario scenarios/box/run_all.yaml --circle
# Fields set here (and flags) apply to every included scenario; run, physics, plume and logging
# fields always come from here. Exit code 0 means every check of every scenario passed.

task: dock
include:
  - scenarios/box/3x3/base.yaml
  - scenarios/box/diamond/base.yaml
  - scenarios/box/pair/base.yaml
  - scenarios/box/rows/base.yaml
