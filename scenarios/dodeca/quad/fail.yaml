# dodeca/quad/fail: Dodecacopter quadrotor (Garanger et al. 2026, Fig. 13a): four dodecahedron-caged
#   modules in a rhombus (1 + 2 + 1); neighbours share two vertices. size n: rhombus of side n.
# Mission: dock, hover, climb to fail_z; chosen modules drop to `outage` x their thrust for outage_t,
#   the assembly recovers, hovers final_t and lands.
#
#   python simulate.py --scenario scenarios/dodeca/quad/fail.yaml
#   python simulate.py --scenario scenarios/dodeca/quad/fail.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/dodeca/quad/fail.yaml --size 3
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: dodeca
layout: rhombus
size: 2
failure: true
fail_mask: '0,1,0,0'
