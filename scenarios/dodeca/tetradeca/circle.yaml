# dodeca/tetradeca/circle: Dodecacopter tetrahedron decarotor (Fig. 13e): ten dodecahedron-caged modules,
#   6 + 3 + 1 in three layers; neighbours share two vertices.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/dodeca/tetradeca/circle.yaml
#   python simulate.py --scenario scenarios/dodeca/tetradeca/circle.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/dodeca/tetradeca/circle.yaml --size 4
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: dodeca
layout: pyramid
size: 3
hover_t: 5.0   # stacked dodecahedra sit in each other's downwash: the assembly sags ~12 cm after the snap and the integral needs ~4 s
circle: true
radius: 1.0
laps: 2
