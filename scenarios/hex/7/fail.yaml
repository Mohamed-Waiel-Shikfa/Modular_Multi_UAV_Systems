# hex/7/fail: Seven hex-caged modules in a hexagon (2 + 3 + 2, a centre and its ring), docked face to face.
# Mission: dock, hover, climb to fail_z; chosen modules drop to `outage` x their thrust for outage_t,
#   the assembly recovers, hovers final_t and lands.
#
#   python simulate.py --scenario scenarios/hex/7/fail.yaml
#   python simulate.py --scenario scenarios/hex/7/fail.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/hex/7/fail.yaml --size 3
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: hex
layout: hexagon
size: 2
failure: true
fail_mask: edge   # the -x end of the middle row (module 2)
