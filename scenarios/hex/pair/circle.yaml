# hex/pair/circle: Two hex-caged modules side by side (module 0 at -x, 1 at +x), docked face to face.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/hex/pair/circle.yaml
#   python simulate.py --scenario scenarios/hex/pair/circle.yaml --sim mujoco --gui
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: hex
layout: rows
rows: [2]
start_spacing: 1.0
circle: true
radius: 1.0
laps: 2
