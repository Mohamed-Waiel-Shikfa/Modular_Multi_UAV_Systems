# tetra/10/fail: Ten tetrahedron-caged modules in a pyramid (6 + 3 + 1); neighbours share a cage vertex.
# Mission: dock, hover, climb to fail_z; chosen modules drop to `outage` x their thrust for outage_t,
#   the assembly recovers, hovers final_t and lands.
#
#   python simulate.py --scenario scenarios/tetra/10/fail.yaml
#   python simulate.py --scenario scenarios/tetra/10/fail.yaml --sim mujoco --gui
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: tetra
layout: pyramid
size: 3
failure: true
fail_mask: edge   # the -x edge of the bottom layer (3 modules)
