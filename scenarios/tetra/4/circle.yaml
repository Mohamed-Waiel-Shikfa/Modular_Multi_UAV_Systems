# tetra/4/circle: Four tetrahedron-caged modules in a pyramid (3 + 1); neighbours share a cage vertex.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/tetra/4/circle.yaml
#   python simulate.py --scenario scenarios/tetra/4/circle.yaml --sim mujoco --gui
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: tetra
layout: pyramid
size: 2
circle: true
radius: 1.0
laps: 2
