# tetra/recursive/base: Tetrahedron-caged modules in a pyramid of `size` layers (4 by default: 10 + 6 + 3 + 1);
#   neighbours share a cage vertex. size n gives n(n+1)(n+2)/6 modules.
# Mission: dock in the air, hover, land.
#
#   python simulate.py --scenario scenarios/tetra/recursive/base.yaml
#   python simulate.py --scenario scenarios/tetra/recursive/base.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/tetra/recursive/base.yaml --size 5
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: tetra
layout: pyramid
size: 4
