# tetra/recursive/fail: Tetrahedron-caged modules in a pyramid of `size` layers (4 by default: 10 + 6 + 3 + 1);
#   neighbours share a cage vertex. size n gives n(n+1)(n+2)/6 modules.
# Mission: dock, hover, climb to fail_z; chosen modules drop to `outage` x their thrust for outage_t,
#   the assembly recovers, hovers final_t and lands.
#
#   python simulate.py --scenario scenarios/tetra/recursive/fail.yaml
#   python simulate.py --scenario scenarios/tetra/recursive/fail.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/tetra/recursive/fail.yaml --size 5
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: tetra
layout: pyramid
size: 4
failure: true
fail_mask: edge   # the -x edge of the bottom layer (size modules)
