# tiling/dodecagons/circle: 4.6.12 (truncated trihexagonal) tiling: 13 modules, one 12-gon (10 kg, drone scale 7.2) ringed
#   by squares (212 g) and hexagons (1.2 kg): a 50-to-1 mass range in one rigid assembly.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/tiling/dodecagons/circle.yaml
#   python simulate.py --scenario scenarios/tiling/dodecagons/circle.yaml --sim mujoco --gui
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: tiling
tiling: 4.6.12
layout: rings
size: 1
drone_scale: fit   # every tile carries the largest Froude-scaled CF2X that fits it
circle: true
radius: 1.0
laps: 2
