# tiling/kagome/circle: 3.6.3.6 (kagome) tiling: 13 modules, hexagons (1.2 kg) and triangles (33 g) alternating;
#   every triangle docked between two hexagons.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/tiling/kagome/circle.yaml
#   python simulate.py --scenario scenarios/tiling/kagome/circle.yaml --sim mujoco --gui
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: tiling
tiling: 3.6.3.6
layout: rings
size: 2
drone_scale: fit   # every tile carries the largest Froude-scaled CF2X that fits it
circle: true
radius: 1.0
laps: 2
