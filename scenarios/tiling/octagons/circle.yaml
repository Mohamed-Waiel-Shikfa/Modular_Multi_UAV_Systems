# tiling/octagons/circle: 4.8.8 (truncated square) tiling: 9 modules, octagons (2.6 kg, drone scale 4.6) and squares
#   (212 g) docked face to face.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/tiling/octagons/circle.yaml
#   python simulate.py --scenario scenarios/tiling/octagons/circle.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/tiling/octagons/circle.yaml --size 2
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: tiling
tiling: 4.8.8
layout: rings
size: 1
drone_scale: fit   # every tile carries the largest Froude-scaled CF2X that fits it
circle: true
radius: 1.0
laps: 2
