# triangle/edge6/circle: Six triangle-caged modules in a triangle (1 + 2 + 3), all pointing +y; neighbours share a
#   vertical cage edge.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/triangle/edge6/circle.yaml
#   python simulate.py --scenario scenarios/triangle/edge6/circle.yaml --sim mujoco --gui
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: triangle
triangle_connect: edge
layout: triangle
size: 3
circle: true
radius: 1.0
laps: 2
