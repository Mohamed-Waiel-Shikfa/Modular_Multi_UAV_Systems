# triangle/edge6/fail: Six triangle-caged modules in a triangle (1 + 2 + 3), all pointing +y; neighbours share a
#   vertical cage edge.
# Mission: dock, hover, climb to fail_z; chosen modules drop to `outage` x their thrust for outage_t,
#   the assembly recovers, hovers final_t and lands.
#
#   python simulate.py --scenario scenarios/triangle/edge6/fail.yaml
#   python simulate.py --scenario scenarios/triangle/edge6/fail.yaml --sim mujoco --gui
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: triangle
triangle_connect: edge
layout: triangle
size: 3
failure: true
fail_mask: '1,1,0,1,0,0'   # the left edge
