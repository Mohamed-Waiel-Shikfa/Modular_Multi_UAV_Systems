# triangle/face4/circle: Four triangle-caged modules tiling a triangle of twice the edge (1 + 3): the middle one
#   points -y (turned 180 deg), the others +y; neighbours share a full face.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/triangle/face4/circle.yaml
#   python simulate.py --scenario scenarios/triangle/face4/circle.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/triangle/face4/circle.yaml --size 3
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: triangle
triangle_connect: face
layout: triangle
size: 2
circle: true
radius: 1.0
laps: 2
