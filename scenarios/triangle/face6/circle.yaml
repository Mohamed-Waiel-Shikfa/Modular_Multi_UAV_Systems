# triangle/face6/circle: Six triangle-caged modules tiling a hexagon (3 + 3), alternately pointing +y and -y;
#   neighbours share a full face.
# Mission: dock, hover, fly `laps` laps of a horizontal circle of `radius`, land.
#
#   python simulate.py --scenario scenarios/triangle/face6/circle.yaml
#   python simulate.py --scenario scenarios/triangle/face6/circle.yaml --sim mujoco --gui
#   python simulate.py --scenario scenarios/triangle/face6/circle.yaml --size 2
# Any field of scenarios/master.yaml can be added here or overridden with a flag of the same name.
# Exit code 0 means every self-check passed.

task: dock
cage: triangle
triangle_connect: face
layout: hexagon
size: 1
circle: true
radius: 1.0
laps: 2
