# triangle/run_all: every base scenario of the triangle cage, flying at the same time in one simulation, side by side.
#
#   python simulate.py --scenario scenarios/triangle/run_all.yaml --gui
#   python simulate.py --scenario scenarios/triangle/run_all.yaml --circle
# Fields set here (and flags) apply to every included scenario; run, physics, plume and logging
# fields always come from here. Exit code 0 means every check of every scenario passed.

task: dock
include:
  - scenarios/triangle/edge3/base.yaml
  - scenarios/triangle/edge6/base.yaml
  - scenarios/triangle/face4/base.yaml
  - scenarios/triangle/face6/base.yaml
